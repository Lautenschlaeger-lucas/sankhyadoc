name: sync-swagger

on:
  schedule:
    - cron: '0 */6 * * *'  # a cada 6 horas
  workflow_dispatch:
    inputs:
      swagger_url:
        description: 'URL do Swagger/OpenAPI'
        required: false
        default: ''

concurrency:
  group: sync-swagger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar OpenAPI
        run: python scripts/sync-swagger.py "${{ github.event.inputs.swagger_url || env.SWAGGER_URL }}"
        env:
          SWAGGER_URL: ${{ secrets.SWAGGER_URL }}

      - name: Commit e push se houver mudancas
        run: |
          if git diff --quiet public/api-data/openapi.json; then
            echo "Nenhuma mudanca detectada."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/api-data/openapi.json
            git commit -m 'Atualiza openapi.json a partir do Swagger'
            git push
          fi
